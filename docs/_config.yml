# ScoreSight documentation site (GitHub Pages, built from main:/docs)
# Theme: Just the Docs - https://just-the-docs.com/
#
# Local preview (optional):
#   cd docs
#   bundle install
#   bundle exec jekyll serve
#   open http://localhost:4000/scoresight/

title: ScoreSight
description: >-
  Free, open-source, real-time scoreboard OCR. Read scores, clocks and periods
  from cameras, capture cards, NDI, streams, screens and video files, and send
  them to OBS, vMix, overlays.uno, browsers, files and your own apps.

url: "https://royshil.github.io"
baseurl: "/scoresight"

remote_theme: just-the-docs/just-the-docs@v0.12.0

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap

relative_links:
  enabled: true
  collections: false

logo: "/logo.png"
favicon_ico: "/favicon.ico"
color_scheme: dark

search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "Download":
    - "https://github.com/royshil/scoresight/releases/latest"
  "Community":
    - "https://github.com/royshil/scoresight/discussions"
  "GitHub":
    - "https://github.com/royshil/scoresight"
aux_links_new_tab: true

nav_external_links:
  - title: Changelog
    url: https://github.com/royshil/scoresight/blob/main/CHANGELOG.md
  - title: Ask a question
    url: https://github.com/royshil/scoresight/discussions
  - title: Report an issue
    url: https://github.com/royshil/scoresight/issues/new/choose

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/royshil/scoresight"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "edit"

footer_content: >-
  ScoreSight is free and open source under the
  <a href="https://github.com/royshil/scoresight/blob/main/LICENSE">MIT license</a>.
  Found a problem with these docs?
  <a href="https://github.com/royshil/scoresight/issues/new/choose">Open an issue</a>.

callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  important:
    title: Important
    color: purple
  warning:
    title: Warning
    color: red
  new:
    title: New in 0.2.0
    color: yellow

mermaid:
  version: "11.4.1"

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .jekyll-cache/
  - .sass-cache/
