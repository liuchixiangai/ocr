# Tool configuration only. ScoreSight is not an installable package:
# dependencies live in requirements*.txt and the version in src/version.py.

[tool.ruff]
target-version = "py313"
line-length = 88
# Python files only: ruff 0.17 would otherwise also format the Python code
# blocks embedded in the Markdown docs.
include = ["*.py", "*.pyi", "**/pyproject.toml"]
# Generated Qt Designer modules (regenerate with scripts/compile_ui.py) and
# agent/IDE worktrees nested inside the repo.
extend-exclude = ["src/ui_*.py", ".claude"]

[tool.ruff.lint]
# Ruff's default rule set (pyflakes + the pycodestyle rules that don't overlap
# with the formatter). Import sorting (I) is intentionally not enabled.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# src/ for the app's flat modules; the repository root for the ocr_eval package
pythonpath = ["src", "."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
qt_api = "pyside6"
markers = [
    "ocr: needs tesserocr and the bundled tesseract/tessdata models",
    "ppocr: needs onnxruntime and the PP-OCR models (python scripts/fetch_models.py)",
    "qt: needs a Qt application (runs headless with QT_QPA_PLATFORM=offscreen)",
]
