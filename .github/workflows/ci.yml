# Lint and test every pull request and every push to main.
# Packaged builds run in build.yml (on pull requests that touch packaging) and
# release.yml (on release tags).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # cancel superseded pull request runs; let every main push finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: ruff check
        run: python -m ruff check --output-format=github .

      - name: ruff format
        run: python -m ruff format --check --diff .

      - name: Generated UI files are up to date
        run: python scripts/compile_ui.py --check

      - name: Translations are up to date
        # every tr() string is in translations/*.ts and every .qm is compiled
        # from its .ts (fix: python scripts/update_translations.py)
        run: python scripts/update_translations.py --check

      - name: No links to the lapsed scoresight.live domain
        # The domain is parked and for sale. Only links and email addresses are
        # flagged, so mentions of the name (this step, tests asserting its
        # absence, defanged warnings) pass. Translation sources keep obsolete
        # strings until the next lupdate, so they are not checked.
        run: |
          if git grep -nIiE '(https?://|www\.|@)([a-z0-9-]+\.)*scoresight\.live' -- . ':!translations/*.ts'; then
            echo "::error::Found links to scoresight.live (see above). Link to https://github.com/royshil/scoresight instead."
            exit 1
          fi

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # the Python 3.14 leg is informational: its dependencies may lag behind
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runners are scarce: test macOS on main only
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04", "windows-latest"]' || '["ubuntu-24.04", "windows-latest", "macos-latest"]') }}
        python: ["3.13"]
        experimental: [false]
        include:
          - os: ubuntu-24.04
            python: "3.14"
            experimental: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        # what PySide6's offscreen platform plugin links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libx11-6 libxkbcommon0 libfontconfig1 libfreetype6 libdbus-1-3

      - name: Install dependencies
        shell: bash
        run: |
          requirements=(-r requirements-dev.txt)
          case "$RUNNER_OS" in
            Windows) requirements+=(-r requirements-win.txt) ;;
            macOS) requirements+=(-r requirements-mac.txt) ;;
          esac
          python -m pip install "${requirements[@]}"

      - name: Show versions
        run: python -c "import sys, PySide6, tesserocr; print(sys.version); print('PySide6', PySide6.__version__); print('Tesseract', tesserocr.tesseract_version().splitlines()[0])"

      - name: Cache the PP-OCR models
        uses: actions/cache@v6
        with:
          path: |
            ocr_models/ppocr/PP-OCRv6_small_rec
            ocr_models/ppocr/PP-OCRv6_tiny_rec
          # the script pins every file's revision and SHA-256
          key: ppocr-models-${{ hashFiles('scripts/fetch_models.py') }}

      - name: Fetch the PP-OCR models
        # downloads what the cache didn't restore and checks every file's
        # SHA-256; after its retries it fails rather than letting the tests
        # and the end-to-end test run without PP-OCR
        run: python scripts/fetch_models.py

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          # the PP-OCR tests fail instead of being skipped without the models
          SCORESIGHT_REQUIRE_PPOCR: "1"
        run: python -m pytest -ra

      - name: End-to-end test (from source)
        # the real app, headless, reading a synthetic scoreboard video: the
        # readings must reach the HTTP server, the files and the outbound API.
        # Once with Tesseract, then with a new setup's PP-OCR (automatic).
        timeout-minutes: 10
        shell: bash
        env:
          LABEL: ${{ matrix.os }}, Python ${{ matrix.python }}, from source
        run: |-
          if compgen -G "tesseract/tessdata/*.traineddata" > /dev/null; then python scripts/ci/e2e_test.py --engine tesseract --label "$LABEL" --work-dir "$RUNNER_TEMP/e2e/tesseract" -- python src/main.py; else echo "::notice::Skipping the Tesseract end-to-end test: tesseract/tessdata is not in this tree."; fi
          python scripts/ci/e2e_test.py --label "$LABEL" --work-dir "$RUNNER_TEMP/e2e/ppocr" -- python src/main.py

      - name: Upload the end-to-end test's files
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.os }}-python${{ matrix.python }}
          # the video, the settings, the app's logs and outputs
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
          retention-days: 7
