name: Feature request
description: Suggest a new feature or an improvement for ScoreSight.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping to improve ScoreSight! Please check the [documentation](https://royshil.github.io/scoresight/) first. The feature you need may already exist (for example custom fields, template fields, the dot counter, profiles for multiple cameras, or the HTTP API).

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe your production and what is hard or impossible today. Start from the use case, not the solution.
      placeholder: When I stream volleyball, I need the set scores and the serving team in my graphics, but...
    validations:
      required: true

  - type: input
    id: context
    attributes:
      label: Sport / scoreboard / software
      description: Which sport, scoreboard (make and model if known) and production software (OBS, vMix, ...) is this for?
      placeholder: Volleyball, Daktronics All Sport 5000, vMix 28

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work? Mock-ups and screenshots are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: What have you tried, or how do you work around it today?

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Sample images or clips of the scoreboard, links to similar tools, and so on.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched the [existing issues](https://github.com/royshil/scoresight/issues?q=is%3Aissue) and this hasn't been requested yet.
          required: true
        - label: I'd be willing to help implement or test this feature.
